# Houston (Tierra) en Docker: su MongoDB, el receptor suscrito a Mosquitto y el servidor web.
#
#   cd houston
#   docker compose up -d --build        http://localhost:8090
#   docker compose logs -f receptor     ver qué llega de Mosquitto
#   docker compose down                 detener (los datos quedan en el volumen houston-mongo)
#
# Mosquitto corre fuera de Docker (en la nave): por defecto en esta misma PC (host.docker.internal). Si está en otra
# laptop, poner HOUSTON_MQTT_HOST=IP-de-Bri en houston/.env. Usuario y clave salen de config.local.env (si existe).
name: houston

x-app: &app
  build:
    context: ..
    dockerfile: houston/Dockerfile
  image: houston-app
  env_file:
    - path: ../config.local.env
      required: false
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped

services:
  mongo:
    image: mongo:8
    command: ["--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "127.0.0.1:27018:27017"   # solo esta PC (27017 es el MongoDB de la nave)
    volumes:
      - houston-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  receptor:
    <<: *app
    command: ["python", "houston/receptor.py"]
    environment:
      HOUSTON_MONGO_URI: mongodb://mongo:27017
      MQTT_HOST: ${HOUSTON_MQTT_HOST:-host.docker.internal}
      HOUSTON_RETRASO_S: ${HOUSTON_RETRASO_S:-}   # vacío = RETRASO_TIERRA_S (20 s); 0 = sin retraso
    depends_on:
      mongo:
        condition: service_healthy

  web:
    <<: *app
    command: ["python", "houston/servidor.py", "--puerto", "8090"]
    environment:
      HOUSTON_MONGO_URI: mongodb://mongo:27017
    ports:
      - "${HOUSTON_PUERTO:-8090}:8090"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  houston-mongo:
