# Mosquitto para el EVENTO (laptop de Xone).
# Se arranca desde la carpeta del proyecto: iniciar.bat lo hace solo.
per_listener_settings false

# 1883: programas en Python y el ESP32
listener 1883
# 9001: paneles web en el navegador (WebSocket)
listener 9001
protocol websockets

# Nadie entra sin usuario. "sistema" publica y lee; "equipo" solo lee.
allow_anonymous false
password_file mosquitto/passwd
acl_file mosquitto/acl
