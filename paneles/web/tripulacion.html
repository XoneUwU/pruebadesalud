<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tripulación · ¿Está apto hoy?</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body class="tripulacion">
  <header class="barra">
    <a class="marca" href="./">¿Está apto hoy?<span class="pagina">Tripulación</span></a>
    <div class="barra-centro" id="reloj"></div>
    <div class="barra-der">
      <span id="conexion" class="conexion" data-estado="conectando"><span class="punto"></span><span class="texto">Conectando…</span></span>
    </div>
  </header>

  <main>
    <section class="recomendacion panel" id="recomendacion" aria-live="polite">
      <span class="etiqueta" id="rec-etiqueta">Recomendación</span>
      <div class="titular" id="rec-titular">Esperando evaluaciones…</div>
      <p class="texto" id="rec-texto"></p>
    </section>

    <section aria-label="Integrantes">
      <div class="tarjetas" id="tarjetas"></div>
    </section>

    <aside class="lateral panel" aria-label="Últimas respuestas del copiloto">
      <h2 class="etiqueta">Copiloto · últimas respuestas</h2>
      <ol id="copiloto"><li class="vacio">Todavía no hay respuestas.</li></ol>
    </aside>
  </main>

  <script src="config.js"></script>
  <script src="vendor/mqtt.min.js"></script>
  <script src="logica.js"></script>
  <script src="comun.js"></script>
  <script src="tripulacion.js"></script>
</body>
</html>
