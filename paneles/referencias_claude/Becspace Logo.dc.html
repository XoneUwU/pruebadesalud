<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
</helmet>
<svg ref="{{ svgRef }}" viewBox="{{ viewBox }}" role="img" aria-label="Becspace" style="display:block;width:100%;height:auto;overflow:visible">
  <defs>
    <radialGradient id="{{ id.ocean }}" cx="36%" cy="30%" r="80%"><stop offset="0" stop-color="#1d6b6a"></stop><stop offset="0.45" stop-color="#0c3b44"></stop><stop offset="1" stop-color="#04141c"></stop></radialGradient>
    <radialGradient id="{{ id.shade }}" cx="30%" cy="28%" r="85%"><stop offset="0.45" stop-color="#000" stop-opacity="0"></stop><stop offset="1" stop-color="#000" stop-opacity="0.65"></stop></radialGradient>
    <linearGradient id="{{ id.silver }}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="{{ tx.s0 }}"></stop><stop offset="0.5" stop-color="{{ tx.s1 }}"></stop><stop offset="0.62" stop-color="{{ tx.s2 }}"></stop><stop offset="1" stop-color="{{ tx.s3 }}"></stop></linearGradient>
    <linearGradient id="{{ id.trail }}" x1="0" x2="1"><stop offset="0" stop-color="#6CFF8F" stop-opacity="0"></stop><stop offset="0.7" stop-color="#6CFF8F" stop-opacity="0.65"></stop><stop offset="1" stop-color="#E9FFF0" stop-opacity="0.95"></stop></linearGradient>
    <linearGradient id="{{ id.body }}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F5F7FA"></stop><stop offset="0.55" stop-color="#C8D2D9"></stop><stop offset="1" stop-color="#7d8a95"></stop></linearGradient>
    <radialGradient id="{{ id.flash }}"><stop offset="0" stop-color="#E9FFF0" stop-opacity="1"></stop><stop offset="0.35" stop-color="#6CFF8F" stop-opacity="0.85"></stop><stop offset="1" stop-color="#00C896" stop-opacity="0"></stop></radialGradient>
    <filter id="{{ id.glow }}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"></feGaussianBlur></filter>
    <filter id="{{ id.bglow }}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.2"></feGaussianBlur></filter>
    <filter id="{{ id.soft }}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"></feGaussianBlur></filter>
    <clipPath id="{{ id.earth }}"><circle cx="300" cy="200" r="128"></circle></clipPath>
    <clipPath id="{{ id.text }}"><text x="292" y="252" text-anchor="middle" transform="skewX(-12) translate(48 0)" style="font-family:Inter, system-ui, sans-serif;font-size:96px;font-weight:700;letter-spacing:-1px">Becspace</text></clipPath>
    <g id="{{ id.rocket }}">
      <rect x="-64" y="-3.5" width="56" height="7" rx="3.5" fill="url(#{{ id.trail }})" style="filter:blur(1.5px)"></rect>
      <path d="M-10 -3 L-20 0 L-10 3 Z" style="fill:#6CFF8F"></path>
      <path d="M-6 -6 L-14 -14 L-2 -7 Z" style="fill:#C8D2D9"></path>
      <path d="M-6 6 L-14 14 L-2 7 Z" style="fill:#9AA7B2"></path>
      <path d="M22 0 C16 -8 4 -8 -8 -6 L-8 6 C4 8 16 8 22 0 Z" fill="url(#{{ id.body }})"></path>
      <circle cx="7" cy="0" r="3.6" style="fill:#0b2a24;stroke:#6CFF8F;stroke-width:1.4"></circle>
      <path d="M-8 -6 L-8 6" style="stroke:#00C896;stroke-width:1.2"></path>
    </g>
  </defs>
  <g data-k="orbit-back" transform="rotate(-11 300 200)">
    <path d="M50 200 A250 50 0 0 1 550 200" style="fill:none;stroke:{{ tx.og }};stroke-width:5;opacity:.35" filter="url(#{{ id.glow }})"></path>
    <path d="M50 200 A250 50 0 0 1 550 200" style="fill:none;stroke:{{ tx.ol }};stroke-width:1.6;opacity:.75"></path>
  </g>
  <g data-k="rocket-back"><use href="#{{ id.rocket }}"></use></g>
  <circle cx="300" cy="200" r="134" style="fill:#00C896;opacity:.38" filter="url(#{{ id.glow }})"></circle>
  <circle cx="300" cy="200" r="128" fill="url(#{{ id.ocean }})"></circle>
  <g clip-path="url(#{{ id.earth }})">
    <g data-k="geo">
      <path data-k="land" style="fill:#2a7a45;stroke:#5ee08f;stroke-width:.6;stroke-opacity:.6"></path>
      <path data-k="borders" style="fill:none;stroke:#62e39a;stroke-width:.45;stroke-opacity:.45"></path>
      <sc-for list="{{ cities }}" as="c" hint-placeholder-count="0"><circle data-city="{{ c.i }}" r="{{ c.r }}" style="fill:#d9ff6a;opacity:0"></circle></sc-for>
      <g data-k="bolivia" style="opacity:0">
        <path data-k="bol-glow" filter="url(#{{ id.bglow }})" style="fill:#2bff8a;fill-opacity:.55;stroke:#6CFF8F;stroke-width:3"></path>
        <path data-k="bol" style="fill:#3cf28c;fill-opacity:.42;stroke:#b9ffd0;stroke-width:.9;stroke-linejoin:round"></path>
        <circle data-k="cbba" r="1.8" style="fill:#F4FFF7"></circle>
        <circle data-k="cbba-halo" r="5" style="fill:#6CFF8F;opacity:.45" filter="url(#{{ id.soft }})"></circle>
      </g>
    </g>
    <circle cx="300" cy="200" r="128" fill="url(#{{ id.shade }})"></circle>
  </g>
  <path d="M206 108 A128 128 0 0 1 404 124" style="fill:none;stroke:#6CFF8F;stroke-width:3;opacity:.9" filter="url(#{{ id.soft }})"></path>
  <circle cx="300" cy="200" r="128" style="fill:none;stroke:#6CFF8F;stroke-width:1;opacity:.45"></circle>
  <g data-k="orbit-front" transform="rotate(-11 300 200)">
    <path d="M550 200 A250 50 0 0 1 50 200" style="fill:none;stroke:{{ tx.og }};stroke-width:6;opacity:.45" filter="url(#{{ id.glow }})"></path>
    <path d="M550 200 A250 50 0 0 1 50 200" style="fill:none;stroke:{{ tx.ol }};stroke-width:2;opacity:.95"></path>
  </g>
  <g data-k="rocket-front"><use href="#{{ id.rocket }}"></use></g>
  <text x="292" y="252" text-anchor="middle" transform="skewX(-12) translate(48 0)" style="font-family:Inter, system-ui, sans-serif;font-size:96px;font-weight:700;letter-spacing:-1px;fill:{{ tx.shadow }};opacity:.45" filter="url(#{{ id.soft }})">Becspace</text>
  <text x="292" y="252" text-anchor="middle" transform="skewX(-12) translate(48 0)" fill="url(#{{ id.silver }})" style="font-family:Inter, system-ui, sans-serif;font-size:96px;font-weight:700;letter-spacing:-1px;stroke:{{ tx.edge }};stroke-width:{{ tx.ew }};stroke-opacity:{{ tx.eo }};paint-order:stroke fill;stroke-linejoin:round">Becspace</text>
  <g clip-path="url(#{{ id.text }})"><circle data-k="flash" cx="-100" cy="-100" r="30" fill="url(#{{ id.flash }})" style="opacity:0"></circle></g>
  <circle data-k="spark" cx="-100" cy="-100" r="14" fill="url(#{{ id.flash }})" style="opacity:0"></circle>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:600,&quot;height&quot;:360},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;full&quot;,&quot;compact&quot;],&quot;default&quot;:&quot;full&quot;,&quot;tsType&quot;:&quot;'full' | 'compact'&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;'dark' | 'light'&quot;},&quot;animated&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;duration&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:5,&quot;max&quot;:14,&quot;step&quot;:0.5,&quot;unit&quot;:&quot;s&quot;,&quot;default&quot;:8,&quot;tsType&quot;:&quot;number&quot;}}">
const CX = 300, CY = 200, RX = 250, RY = 50, ROT = (-11 * Math.PI) / 180;
const TXT = { x0: 110, x1: 530, y0: 178, y1: 258 };
let uid = 0;
const CITIES = [[-74.0,40.7],[-118.2,34.1],[-87.6,41.9],[-95.4,29.8],[-80.2,25.8],[-77.0,38.9],[-122.4,37.8],[-79.4,43.7],[-73.6,45.5],[-99.1,19.4],[-84.4,33.7],[-96.8,32.8],[-112.1,33.4],[-104.9,39.7],[-90.2,38.6],[-74.1,4.7],[-79.5,9.0],[-77.0,-12.0],[-78.5,-0.2],[-66.9,10.5],[-70.6,-33.4],[-58.4,-34.6],[-46.6,-23.5],[-43.2,-22.9],[-47.9,-15.8],[-38.5,-12.97],[-34.9,-8.05],[-56.2,-34.9],[-57.6,-25.3],[-68.1,-16.5],[-63.2,-17.8],[-0.1,51.5],[2.35,48.9],[-3.7,40.4],[12.5,41.9],[13.4,52.5],[-9.1,38.7],[4.9,52.4],[16.4,48.2],[3.4,6.5],[31.2,30.0],[-7.6,33.6],[-17.4,14.7],[18.4,-33.9],[28.0,-26.2],[36.8,-1.3]];
const BOL = "068";
const atlas = () => (window.__becAtlas = window.__becAtlas || fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json").then((r) => r.json()));
class Component extends DCLogic {
  svgRef = React.createRef();
  u = "bx" + ++uid;
  componentDidMount() {
    this.t0 = performance.now(); this.vis = true; this.last = 0;
    this.loop = (t) => { if (this.dead) return; if (this.vis && !document.hidden && t - this.last >= 40) { this.last = t; this.frame(t); } this.raf = requestAnimationFrame(this.loop); };
    const el = this.svgRef.current;
    if (el && window.IntersectionObserver) { this.io = new IntersectionObserver((es) => { this.vis = es[0].isIntersecting; }); this.io.observe(el); }
    this.frame(performance.now()); this.raf = requestAnimationFrame(this.loop);
    const boot = () => {
      if (this.dead) return;
      if (!window.d3 || !window.topojson) { this.bootT = setTimeout(boot, 120); return; }
      atlas().then((topo) => {
        if (this.dead) return;
        const countries = topojson.feature(topo, topo.objects.countries);
        this.geo = {
          land: topojson.feature(topo, topo.objects.land),
          borders: topojson.mesh(topo, topo.objects.countries, (a, b) => a !== b),
          bol: countries.features.find((f) => f.id === BOL),
        };
        this.proj = d3.geoOrthographic().translate([300, 200]).scale(128).clipAngle(90).precision(0.6);
        this.path = d3.geoPath(this.proj);
        this.lastGeo = 0; this.frame(performance.now());
      }).catch(() => {});
    };
    boot();
  }
  componentWillUnmount() { this.dead = true; clearTimeout(this.bootT); cancelAnimationFrame(this.raf); if (this.io) this.io.disconnect(); }
  pt(a) { const x = RX * Math.cos(a), y = RY * Math.sin(a); return [CX + x * Math.cos(ROT) - y * Math.sin(ROT), CY + x * Math.sin(ROT) + y * Math.cos(ROT)]; }
  frame(t) {
    const svg = this.svgRef.current; if (!svg) return;
    const q = (k) => (this.els = this.els || {})[k] || (this.els[k] = svg.querySelector('[data-k="' + k + '"]'));
    const reduced = this.props.animated === false || (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const dur = (this.props.duration ?? 8) * 1000;
    const ph = reduced ? 0.47 : (((t - this.t0) % dur) / dur);
    const a = Math.PI - ph * Math.PI * 2;
    const [x, y] = this.pt(a); const [x2, y2] = this.pt(a - 0.01);
    const ang = (Math.atan2(y2 - y, x2 - x) * 180) / Math.PI;
    const front = Math.sin(a) > 0;
    const depth = 0.78 + 0.22 * Math.sin(a);
    const tf = "translate(" + x.toFixed(2) + " " + y.toFixed(2) + ") rotate(" + ang.toFixed(2) + ") scale(" + depth.toFixed(3) + ")";
    const rf = q("rocket-front"), rb = q("rocket-back");
    if (rf) { rf.setAttribute("transform", tf); rf.style.opacity = front ? 1 : 0; }
    if (rb) { rb.setAttribute("transform", tf); rb.style.opacity = front ? 0 : 1; }
    const inTxt = front && x > TXT.x0 && x < TXT.x1 && y > TXT.y0 && y < TXT.y1;
    const fl = q("flash"), sp = q("spark");
    if (fl) { fl.setAttribute("cx", x); fl.setAttribute("cy", y); fl.style.opacity = inTxt ? 0.9 : 0; }
    if (sp) { sp.setAttribute("cx", x + Math.cos((ang * Math.PI) / 180) * 18); sp.setAttribute("cy", y + Math.sin((ang * Math.PI) / 180) * 18); sp.style.opacity = inTxt ? 0.55 + 0.45 * Math.sin(t / 40) : 0; }
    if (this.geo && (reduced ? !this.drawnOnce : t - this.lastGeo >= 60)) {
      this.lastGeo = t; this.drawnOnce = true;
      const sec = (t - this.t0) / 1000;
      const lam = 62 + (reduced ? 0 : sec * 6);
      this.proj.rotate([lam, -12, 0]);
      const P = this.path;
      q("land").setAttribute("d", P(this.geo.land) || "");
      q("borders").setAttribute("d", P(this.geo.borders) || "");
      const centre = [-lam, 12];
      const bolC = [-64.7, -16.3];
      const dist = d3.geoDistance(bolC, centre);
      const vis = Math.max(0, Math.min(1, (1.45 - dist) / 0.35));
      const bg = q("bolivia");
      if (vis > 0 && this.geo.bol) {
        const d = P(this.geo.bol) || "";
        q("bol").setAttribute("d", d); q("bol-glow").setAttribute("d", d);
        const pulse = reduced ? 0.85 : 0.72 + 0.28 * Math.sin(sec * 2.2);
        bg.style.opacity = (vis * pulse).toFixed(3);
        const cb = [-66.16, -17.39]; const p = this.proj(cb);
        if (p) { ["cbba", "cbba-halo"].forEach((k) => { q(k).setAttribute("cx", p[0]); q(k).setAttribute("cy", p[1]); }); }
      } else bg.style.opacity = 0;
      const nodes = this.cityEls || (this.cityEls = svg.querySelectorAll("[data-city]"));
      nodes.forEach((n, i) => {
        const c = CITIES[i]; const dd = d3.geoDistance(c, centre);
        if (dd > 1.5) { n.style.opacity = 0; return; }
        const p = this.proj(c); n.setAttribute("cx", p[0]); n.setAttribute("cy", p[1]);
        n.style.opacity = (Math.min(1, (1.5 - dd) / 0.4) * 0.85).toFixed(2);
      });
    }
  }
  renderVals() {
    if (!this.cities) this.cities = CITIES.map((c, i) => ({ i, r: i % 5 === 0 ? 1.5 : 1 }));
    const light = this.props.tone === "light";
    const tx = light ? { s0: "#F5F7FA", s1: "#E4E9EE", s2: "#C8D2D9", s3: "#9AA7B2", shadow: "#000", edge: "#000000", ew: "6", eo: "1", og: "#1f6b45", ol: "#165a38" } : { s0: "#F5F7FA", s1: "#E4E9EE", s2: "#C8D2D9", s3: "#9AA7B2", shadow: "#000", edge: "#F5F7FA", ew: ".6", eo: ".6", og: "#00C896", ol: "#6CFF8F" };
    const u = this.u; const compact = this.props.variant === "compact";
    return {
      tx, svgRef: this.svgRef, cities: this.cities,
      viewBox: compact ? "30 66 548 272" : "20 40 560 330",
      id: { ocean: u + "o", shade: u + "s", silver: u + "t", trail: u + "r", body: u + "b", flash: u + "f", glow: u + "g", soft: u + "q", earth: u + "e", bglow: u + "w", text: u + "x", rocket: u + "k" },
    };
  }
}
</script>
